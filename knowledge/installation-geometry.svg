<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">INSTALLATION / RECORD POSITION AND ORIENTATION</text><text x="45" y="87" fill="#94a3b8" font-size="19">A site coordinate frame links station observations to a floor plan. Survey before tuning.</text><path d="M45 113H1155" stroke="#334155"/><rect x="60" y="155" width="660" height="425" rx="16" fill="#0f172a" stroke="#475569"/>
