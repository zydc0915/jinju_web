  <text x="942" y="386" fill="#34d399" font-size="22">Height Z</text><text x="800" y="528" fill="#cbd5e1" font-size="20">Also record tilt and tag height.</text><text x="800" y="562" fill="#94a3b8" font-size="18">No universal mounting height.</text><path d="M45 622H1155" stroke="#334155"/><text x="45" y="655" fill="#64748b" font-size="15">JINJU / POSITIONING TECHNOLOGIES</text><text x="840" y="655" fill="#64748b" font-size="15">CONCEPT ONLY · NOT TO SCALE</text></g></svg>