<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">BATTERY LIFE / TEST THE WORKING PROFILE</title><desc id="desc">Use measured average current and usable capacity, then verify the actual shift with a reserve.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern><marker id="cyan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#22d3ee" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34d399" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" fill="#020617"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">BATTERY LIFE / TEST THE WORKING PROFILE</text><text x="45" y="87" fill="#94a3b8" font-size="19">Use measured average current and usable capacity, then verify the actual shift with a reserve.</text><path d="M45 113H1155" stroke="#334155"/><rect x="60" y="205" width="240" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="82" y="245" fill="#f8fafc" font-size="23">Active work</text><text x="82" y="277" fill="#94a3b8" font-size="18">Position updates</text><rect x="345" y="205" width="240" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="367" y="245" fill="#f8fafc" font-size="23">Idle periods</text><text x="367" y="277" fill="#94a3b8" font-size="18">Configured sleep</text><rect x="630" y="205" width="240" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="652" y="245" fill="#f8fafc" font-size="23">Alert events</text><text x="652" y="277" fill="#94a3b8" font-size="18">Audio / vibration</text><rect x="915" y="205" width="240" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="937" y="245" fill="#f8fafc" font-size="23">Charging</text><text x="937" y="277" fill="#94a3b8" font-size="18">Dock + spare pool</text>
  <path d="M306 255 L334 255" fill="none" stroke="#22d3ee" stroke-width="3"  marker-end="url(#cyan)"/><path d="M591 255 L619 255" fill="none" stroke="#22d3ee" stroke-width="3"  marker-end="url(#cyan)"/><path d="M876 255 L904 255" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/>
  <rect x="60" y="370" width="1095" height="150" rx="14" fill="#0f172a" stroke="#164e63"/>
  <text x="85" y="414" fill="#f8fafc" font-size="25">First-order runtime (hours) = usable capacity (mAh) / average current (mA)</text>
  <text x="85" y="455" fill="#cbd5e1" font-size="22">Measure the complete profile; include retries, sensors and alert usage.</text>
  <text x="85" y="490" fill="#94a3b8" font-size="20">Then allow for temperature, aging, discharge limits and operational reserve.</text>
  <text x="60" y="578" fill="#94a3b8" font-size="21">No device runtime is implied by this diagram. Battery capacity alone does not specify endurance.</text><path d="M45 622H1155" stroke="#334155"/><text x="45" y="655" fill="#64748b" font-size="15">JINJU / POSITIONING TECHNOLOGIES</text><text x="840" y="655" fill="#64748b" font-size="15">CONCEPT ONLY · NOT TO SCALE</text></g></svg>