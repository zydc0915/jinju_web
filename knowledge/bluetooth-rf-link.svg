<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">BLUETOOTH RF / THE COMPLETE LINK</title><desc id="desc">The radio path is one part of a working BLE system. Validate it in the final installation.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern><marker id="cyan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#22d3ee" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34d399" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" fill="#020617"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">BLUETOOTH RF / THE COMPLETE LINK</text><text x="45" y="87" fill="#94a3b8" font-size="19">The radio path is one part of a working BLE system. Validate it in the final installation.</text><path d="M45 113H1155" stroke="#334155"/><rect x="60" y="200" width="290" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="82" y="240" fill="#f8fafc" font-size="23">BLE device</text><text x="82" y="272" fill="#94a3b8" font-size="18">Payload + reporting policy</text><rect x="455" y="200" width="290" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="477" y="240" fill="#f8fafc" font-size="23">2.4 GHz radio path</text><text x="477" y="272" fill="#94a3b8" font-size="18">Shared spectrum + obstacles</text><rect x="850" y="200" width="290" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="872" y="240" fill="#f8fafc" font-size="23">Receiver / gateway</text><text x="872" y="272" fill="#94a3b8" font-size="18">Scanning or connected peer</text>
  <path d="M360 250 L444 250" fill="none" stroke="#22d3ee" stroke-width="3"  marker-end="url(#cyan)"/><path d="M755 250 L839 250" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/>
  <text x="65" y="370" fill="#22d3ee" font-size="18">DEVICE CONDITIONS</text><text x="65" y="416" fill="#f8fafc" font-size="23">Antenna placement</text><text x="65" y="451" fill="#94a3b8" font-size="20">Housing and attachment</text><text x="65" y="486" fill="#94a3b8" font-size="20">Orientation and duty cycle</text>
  <text x="460" y="370" fill="#22d3ee" font-size="18">SITE CONDITIONS</text><text x="460" y="416" fill="#f8fafc" font-size="23">Nearby radio traffic</text><text x="460" y="451" fill="#94a3b8" font-size="20">Racks, people and vehicles</text><text x="460" y="486" fill="#94a3b8" font-size="20">Visibility and reflections</text>
  <text x="855" y="370" fill="#34d399" font-size="18">SYSTEM CONDITIONS</text><text x="855" y="416" fill="#f8fafc" font-size="23">Receiver settings</text><text x="855" y="451" fill="#94a3b8" font-size="20">Backhaul and timestamps</text><text x="855" y="486" fill="#94a3b8" font-size="20">Application data handling</text>
  <text x="65" y="579" fill="#cbd5e1" font-size="23">A received packet is not automatically a distance measurement or a position fix.</text><path d="M45 622H1155" stroke="#334155"/><text x="45" y="655" fill="#64748b" font-size="15">JINJU / BLUETOOTH TECHNOLOGY</text><text x="840" y="655" fill="#64748b" font-size="15">CONCEPT ONLY · NOT TO SCALE</text></g></svg>