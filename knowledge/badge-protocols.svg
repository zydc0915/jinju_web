<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">BADGE SELECTION / DEFINE EACH INTERFACE</title><desc id="desc">Positioning and communication are distinct roles. Verify the exact model and firmware combination.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern><marker id="cyan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#22d3ee" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34d399" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" fill="#020617"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">BADGE SELECTION / DEFINE EACH INTERFACE</text><text x="45" y="87" fill="#94a3b8" font-size="19">Positioning and communication are distinct roles. Verify the exact model and firmware combination.</text><path d="M45 113H1155" stroke="#334155"/><text x="60" y="175" fill="#22d3ee" font-size="18">MEASURE LOCATION</text><text x="450" y="175" fill="#22d3ee" font-size="18">DELIVER OBSERVATIONS</text><text x="840" y="175" fill="#34d399" font-size="18">USE THE RESULT</text>
  <rect x="60" y="215" width="300" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="82" y="255" fill="#f8fafc" font-size="23">Positioning mode</text><text x="82" y="287" fill="#94a3b8" font-size="18">BLE / AoA / UWB / GNSS</text><rect x="450" y="215" width="300" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="472" y="255" fill="#f8fafc" font-size="23">Compatible receiver</text><text x="472" y="287" fill="#94a3b8" font-size="18">Gateway + network + decoder</text><rect x="840" y="215" width="300" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="862" y="255" fill="#f8fafc" font-size="23">Personnel platform</text><text x="862" y="287" fill="#94a3b8" font-size="18">Identity + location + events</text>
  <path d="M369 265 L439 265" fill="none" stroke="#22d3ee" stroke-width="3"  marker-end="url(#cyan)"/><path d="M759 265 L829 265" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/>
  <text x="60" y="395" fill="#cbd5e1" font-size="21">Ask which modes are fitted.</text><text x="60" y="432" fill="#94a3b8" font-size="19">A multi-mode family may</text><text x="60" y="461" fill="#94a3b8" font-size="19">have different ordered variants.</text>
  <text x="450" y="395" fill="#cbd5e1" font-size="21">Match the protocol.</text><text x="450" y="432" fill="#94a3b8" font-size="19">LoRa does not by itself</text><text x="450" y="461" fill="#94a3b8" font-size="19">establish LoRaWAN support.</text>
  <text x="840" y="395" fill="#cbd5e1" font-size="21">Verify the workflow.</text><text x="840" y="432" fill="#94a3b8" font-size="19">Issuance, alerts, access</text><text x="840" y="461" fill="#94a3b8" font-size="19">and retention need definition.</text>
  <text x="60" y="564" fill="#34d399" font-size="22">COMPATIBILITY CHECK: device → radio protocol → receiver → payload → application</text><path d="M45 622H1155" stroke="#334155"/><text x="45" y="655" fill="#64748b" font-size="15">JINJU / POSITIONING TECHNOLOGIES</text><text x="840" y="655" fill="#64748b" font-size="15">CONCEPT ONLY · NOT TO SCALE</text></g></svg>