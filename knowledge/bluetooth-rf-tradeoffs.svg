<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">BLE RADIO / MEASURE THE TRADEOFFS</title><desc id="desc">Set acceptance limits for the actual workload rather than assuming a universal range or battery life.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern><marker id="cyan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#22d3ee" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34d399" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" fill="#020617"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">BLE RADIO / MEASURE THE TRADEOFFS</text><text x="45" y="87" fill="#94a3b8" font-size="19">Set acceptance limits for the actual workload rather than assuming a universal range or battery life.</text><path d="M45 113H1155" stroke="#334155"/><rect x="65" y="165" width="500" height="160" rx="14" fill="#0f172a" stroke="#164e63"/><text x="89" y="208" fill="#22d3ee" font-size="28">01 / Packet availability</text><text x="89" y="253" fill="#cbd5e1" font-size="22">How many expected reports arrive?</text><text x="89" y="288" fill="#94a3b8" font-size="20">Test with realistic nearby traffic.</text>
  <rect x="635" y="165" width="500" height="160" rx="14" fill="#0f172a" stroke="#164e63"/><text x="659" y="208" fill="#22d3ee" font-size="28">02 / Data freshness</text><text x="659" y="253" fill="#cbd5e1" font-size="22">How old is each useful observation?</text><text x="659" y="288" fill="#94a3b8" font-size="20">Include scan timing and processing.</text>
  <rect x="65" y="375" width="500" height="160" rx="14" fill="#0f172a" stroke="#164e63"/><text x="89" y="418" fill="#22d3ee" font-size="28">03 / Energy per work cycle</text><text x="89" y="463" fill="#cbd5e1" font-size="22">What is the measured current profile?</text><text x="89" y="498" fill="#94a3b8" font-size="20">Include receive windows and retries.</text>
  <rect x="635" y="375" width="500" height="160" rx="14" fill="#0f172a" stroke="#164e63"/><text x="659" y="418" fill="#22d3ee" font-size="28">04 / Mechanical installation</text><text x="659" y="463" fill="#cbd5e1" font-size="22">Does the final antenna placement work?</text><text x="659" y="498" fill="#94a3b8" font-size="20">Test the housing, body and mounting.</text>
  <text x="65" y="581" fill="#34d399" font-size="23">Record PHY, payload, reporting interval and receiver settings with every test.</text><path d="M45 622H1155" stroke="#334155"/><text x="45" y="655" fill="#64748b" font-size="15">JINJU / BLUETOOTH TECHNOLOGY</text><text x="840" y="655" fill="#64748b" font-size="15">CONCEPT ONLY · NOT TO SCALE</text></g></svg>