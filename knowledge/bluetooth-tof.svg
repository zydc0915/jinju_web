<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">04 / CHANNEL SOUNDING: RTT + PBR</title><desc id="desc">Ranging needs compatible devices at both ends. Pairwise distance is not a complete position.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern><marker id="cyan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#22d3ee" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34d399" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" fill="#020617"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">04 / CHANNEL SOUNDING: RTT + PBR</text><text x="45" y="87" fill="#94a3b8" font-size="19">Ranging needs compatible devices at both ends. Pairwise distance is not a complete position.</text><path d="M45 113H1155" stroke="#334155"/><rect x="110" y="150" width="310" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="132" y="190" fill="#f8fafc" font-size="23">Initiator</text><text x="132" y="222" fill="#94a3b8" font-size="18">Starts the ranging procedure</text><rect x="755" y="150" width="320" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="777" y="190" fill="#f8fafc" font-size="23">Reflector</text><text x="777" y="222" fill="#94a3b8" font-size="18">Responds to ranging signals</text>
  <path d="M260 265V477M915 265V477" stroke="#475569" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M267 285 L906 335" fill="none" stroke="#22d3ee" stroke-width="3"  marker-end="url(#cyan)"/><text x="455" y="282" fill="#22d3ee" font-size="19">Outbound timing signal</text>
  <path d="M942 337H965V382H942" stroke="#94a3b8" fill="none"/><text x="982" y="360" fill="#94a3b8" font-size="17">Reply</text><text x="982" y="383" fill="#94a3b8" font-size="17">interval</text>
  <path d="M907 387 L269 444" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/><text x="475" y="461" fill="#34d399" font-size="19">Return timing signal</text>
  <text x="70" y="346" fill="#64748b" font-size="18">Time</text><path d="M90 360V435l-5-9m5 9l5-9" stroke="#64748b" fill="none"/>
  <rect x="60" y="515" width="515" height="80" rx="12" fill="#0f172a" stroke="#164e63"/><text x="80" y="548" fill="#22d3ee" font-size="21">RTT / timing</text><text x="80" y="576" fill="#94a3b8" font-size="18">Account for the responder interval and timing errors.</text>
  <rect x="610" y="515" width="530" height="80" rx="12" fill="#0f172a" stroke="#065f46"/><text x="630" y="548" fill="#34d399" font-size="21">PBR / phase-based ranging</text><text x="630" y="576" fill="#94a3b8" font-size="18">Estimate distance from phase across multiple frequencies.</text><path d="M45 622H1155" stroke="#334155"/><text x="45" y="655" fill="#64748b" font-size="15">JINJU / POSITIONING TECHNOLOGIES</text><text x="840" y="655" fill="#64748b" font-size="15">CONCEPT ONLY · NOT TO SCALE</text></g></svg>