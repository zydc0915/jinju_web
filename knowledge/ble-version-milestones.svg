<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">BLE VERSIONS / SELECTED FEATURE MILESTONES</text><text x="45" y="87" fill="#94a3b8" font-size="19">Four selected Core versions. Optional features require matching hardware, firmware and peer support.</text><path d="M45 113H1155" stroke="#334155"/><rect x="65" y="165" width="500" height="160" rx="14" fill="#0f172a" stroke="#164e63"/><text x="89" y="208" fill="#22d3ee" font-size="28">CORE 4.2</text><text x="89" y="253" fill="#cbd5e1" font-size="22">Longer connected data packets</text><text x="89" y="288" fill="#94a3b8" font-size="20">Secure Connections + Link Layer Privacy</text>
  <rect x="635" y="165" width="500" height="160" rx="14" fill="#0f172a" stroke="#164e63"/><text x="659" y="208" fill="#22d3ee" font-size="28">CORE 5.0</text><text x="659" y="253" fill="#cbd5e1" font-size="22">Additional PHY choices: 2M and Coded</text><text x="659" y="288" fill="#94a3b8" font-size="20">Extended and periodic advertising</text>
  <rect x="65" y="375" width="500" height="160" rx="14" fill="#0f172a" stroke="#164e63"/><text x="89" y="418" fill="#22d3ee" font-size="28">CORE 5.1</text><text x="89" y="463" fill="#cbd5e1" font-size="22">Direction finding: AoA and AoD</text><text x="89" y="498" fill="#94a3b8" font-size="20">Compatible signals, sampling and arrays</text>
  <rect x="635" y="375" width="500" height="160" rx="14" fill="#0f172a" stroke="#164e63"/><text x="659" y="418" fill="#22d3ee" font-size="28">CORE 6.0</text><text x="659" y="463" fill="#cbd5e1" font-size="22">Channel Sounding: fine ranging</text><text x="659" y="498" fill="#94a3b8" font-size="20">Plus discovery and timing improvements</text>
