<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">FEATURE SUPPORT / CHECK THE WHOLE CHAIN</title><desc id="desc">A Bluetooth version number does not prove that a particular feature can be used end to end.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern><marker id="cyan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#22d3ee" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34d399" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" fill="#020617"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">FEATURE SUPPORT / CHECK THE WHOLE CHAIN</text><text x="45" y="87" fill="#94a3b8" font-size="19">A Bluetooth version number does not prove that a particular feature can be used end to end.</text><path d="M45 113H1155" stroke="#334155"/><rect x="60" y="205" width="240" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="82" y="245" fill="#f8fafc" font-size="23">Device hardware</text><text x="82" y="277" fill="#94a3b8" font-size="18">Radio + antennas</text><rect x="345" y="205" width="240" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="367" y="245" fill="#f8fafc" font-size="23">Peer hardware</text><text x="367" y="277" fill="#94a3b8" font-size="18">Compatible role</text><rect x="630" y="205" width="240" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="652" y="245" fill="#f8fafc" font-size="23">Firmware + host</text><text x="652" y="277" fill="#94a3b8" font-size="18">Feature + API</text><rect x="915" y="205" width="240" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="937" y="245" fill="#f8fafc" font-size="23">Application</text><text x="937" y="277" fill="#94a3b8" font-size="18">Use and validate</text>
  <path d="M307 255 L334 255" fill="none" stroke="#22d3ee" stroke-width="3"  marker-end="url(#cyan)"/><path d="M592 255 L619 255" fill="none" stroke="#22d3ee" stroke-width="3"  marker-end="url(#cyan)"/><path d="M877 255 L904 255" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/>
  <rect x="60" y="379" width="1095" height="150" rx="14" fill="#0f172a" stroke="#164e63"/>
  <text x="84" y="424" fill="#f8fafc" font-size="24">Example: Channel Sounding needs suitable initiator and reflector implementations.</text>
  <text x="84" y="466" fill="#cbd5e1" font-size="22">Confirm support, configure the procedure and test the distance output.</text>
  <text x="84" y="504" fill="#94a3b8" font-size="21">A pairwise range is not an AoA angle or a complete indoor coordinate.</text>
  <text x="60" y="585" fill="#34d399" font-size="22">Specify the required feature and operating conditions on the device order and test plan.</text><path d="M45 622H1155" stroke="#334155"/><text x="45" y="655" fill="#64748b" font-size="15">JINJU / BLUETOOTH TECHNOLOGY</text><text x="840" y="655" fill="#64748b" font-size="15">CONCEPT ONLY · NOT TO SCALE</text></g></svg>