<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">COMMISSIONING / CALIBRATE, THEN VERIFY</title><desc id="desc">Keep independent validation points separate from the points used to adjust the installation.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern><marker id="cyan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#22d3ee" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34d399" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" fill="#020617"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">COMMISSIONING / CALIBRATE, THEN VERIFY</text><text x="45" y="87" fill="#94a3b8" font-size="19">Keep independent validation points separate from the points used to adjust the installation.</text><path d="M45 113H1155" stroke="#334155"/><rect x="75" y="185" width="450" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="97" y="225" fill="#f8fafc" font-size="23">01 / Record the installation</text><text x="97" y="257" fill="#94a3b8" font-size="18">Survey position, height and orientation</text><rect x="675" y="185" width="450" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="697" y="225" fill="#f8fafc" font-size="23">02 / Configure the site frame</text><text x="697" y="257" fill="#94a3b8" font-size="18">Origin, axes, units and tag-height assumptions</text>
  <path d="M540 235 L655 235" fill="none" stroke="#22d3ee" stroke-width="3"  marker-end="url(#cyan)"/><path d="M900 299 L900 400" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/>
  <rect x="675" y="415" width="450" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="697" y="455" fill="#f8fafc" font-size="23">03 / Follow the device procedure</text><text x="697" y="487" fill="#94a3b8" font-size="18">Manufacturer array / RF calibration, if required</text><rect x="75" y="415" width="450" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="97" y="455" fill="#f8fafc" font-size="23">04 / Validate independent points</text><text x="97" y="487" fill="#94a3b8" font-size="18">Static checks + moving route + quality report</text>
  <path d="M659 465 L544 465" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/><text x="75" y="580" fill="#94a3b8" font-size="21">HANDOVER: configuration record · firmware versions · surveyed points · acceptance evidence</text><path d="M45 622H1155" stroke="#334155"/><text x="45" y="655" fill="#64748b" font-size="15">JINJU / POSITIONING TECHNOLOGIES</text><text x="840" y="655" fill="#64748b" font-size="15">CONCEPT ONLY · NOT TO SCALE</text></g></svg>