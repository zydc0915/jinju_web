<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">01 / TDoA: COMPARE ARRIVAL TIMES</title><desc id="desc">Uplink architecture: the same tag packet reaches fixed receivers at different times.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern><marker id="cyan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#22d3ee" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34d399" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" fill="#020617"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">01 / TDoA: COMPARE ARRIVAL TIMES</text><text x="45" y="87" fill="#94a3b8" font-size="19">Uplink architecture: the same tag packet reaches fixed receivers at different times.</text><path d="M45 113H1155" stroke="#334155"/><text x="55" y="163" fill="#22d3ee" font-size="17">MOVING TAG</text><text x="435" y="163" fill="#22d3ee" font-size="17">SYNCHRONIZED ANCHORS</text>
  <rect x="55" y="300" width="260" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="77" y="340" fill="#f8fafc" font-size="23">UWB tag</text><text x="77" y="372" fill="#94a3b8" font-size="18">One broadcast / blink</text>
  <rect x="435" y="185" width="290" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="457" y="225" fill="#f8fafc" font-size="23">Anchor A</text><text x="457" y="257" fill="#94a3b8" font-size="18">Arrival timestamp tA</text><rect x="435" y="340" width="290" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="457" y="380" fill="#f8fafc" font-size="23">Anchor B</text><text x="457" y="412" fill="#94a3b8" font-size="18">Arrival timestamp tB</text><rect x="435" y="495" width="290" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="457" y="535" fill="#f8fafc" font-size="23">Anchor C</text><text x="457" y="567" fill="#94a3b8" font-size="18">Arrival timestamp tC</text>
  <path d="M320 340 L425 237" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#cyan)"/><path d="M320 350 L425 385" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#cyan)"/><path d="M320 360 L425 539" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#cyan)"/>
  <text x="57" y="467" fill="#cbd5e1" font-size="19">A common time reference</text><text x="57" y="496" fill="#94a3b8" font-size="18">is required at the receivers.</text>
  <rect x="835" y="290" width="320" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="857" y="330" fill="#f8fafc" font-size="23">Location engine</text><text x="857" y="362" fill="#94a3b8" font-size="18">Clock-corrected differences</text>
  <path d="M735 235 L825 305" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/><path d="M735 388 L825 345" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/><path d="M735 543 L825 383" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/>
  <text x="854" y="448" fill="#34d399" font-size="22">Time differences</text><text x="854" y="484" fill="#cbd5e1" font-size="21">→ distance differences</text><text x="854" y="520" fill="#cbd5e1" font-size="21">→ position estimate</text>
  <text x="835" y="208" fill="#94a3b8" font-size="19">Timestamps + anchor map</text><path d="M45 622H1155" stroke="#334155"/><text x="45" y="655" fill="#64748b" font-size="15">JINJU / POSITIONING TECHNOLOGIES</text><text x="840" y="655" fill="#64748b" font-size="15">CONCEPT ONLY · NOT TO SCALE</text></g></svg>