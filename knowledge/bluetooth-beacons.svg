<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">02 / FIXED BEACONS, MOVING RECEIVER</title><desc id="desc">Place reference transmitters at known locations. A scanning terminal observes the surrounding signals.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern><marker id="cyan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#22d3ee" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34d399" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" fill="#020617"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">02 / FIXED BEACONS, MOVING RECEIVER</text><text x="45" y="87" fill="#94a3b8" font-size="19">Place reference transmitters at known locations. A scanning terminal observes the surrounding signals.</text><path d="M45 113H1155" stroke="#334155"/><rect x="50" y="150" width="720" height="410" rx="16" fill="#0f172a" fill-opacity=".6" stroke="#334155"/>
  <rect x="80" y="175" width="250" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="102" y="215" fill="#f8fafc" font-size="23">Beacon A</text><text x="102" y="247" fill="#94a3b8" font-size="18">Known reference ID</text><rect x="480" y="175" width="250" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="502" y="215" fill="#f8fafc" font-size="23">Beacon B</text><text x="502" y="247" fill="#94a3b8" font-size="18">Known reference ID</text>
  <rect x="80" y="425" width="250" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="102" y="465" fill="#f8fafc" font-size="23">Beacon C</text><text x="102" y="497" fill="#94a3b8" font-size="18">Known reference ID</text><rect x="465" y="425" width="270" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="487" y="465" fill="#f8fafc" font-size="23">Moving receiver</text><text x="487" y="497" fill="#94a3b8" font-size="18">Phone / scanning terminal</text>
  <path d="M286 280 L490 416" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#cyan)"/><path d="M606 280 L606 416" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#cyan)"/><path d="M335 476 L455 476" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#cyan)"/>
  <text x="100" y="370" fill="#cbd5e1" font-size="19">Beacon map + RSSI observations</text>
  <rect x="835" y="310" width="310" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="857" y="350" fill="#f8fafc" font-size="23">App or location engine</text><text x="857" y="382" fill="#94a3b8" font-size="18">Estimate receiver location</text><path d="M741 457 L828 384" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/>
  <text x="848" y="468" fill="#cbd5e1" font-size="19">Proximity / zone / fingerprint</text><text x="848" y="500" fill="#94a3b8" font-size="18">RSSI is not exact distance</text>
  <text x="60" y="598" fill="#94a3b8" font-size="19">Here the beacons stay still. In asset tracking, a broadcasting beacon can instead move with the asset.</text><path d="M45 622H1155" stroke="#334155"/><text x="45" y="655" fill="#64748b" font-size="15">JINJU / POSITIONING TECHNOLOGIES</text><text x="840" y="655" fill="#64748b" font-size="15">CONCEPT ONLY · NOT TO SCALE</text></g></svg>