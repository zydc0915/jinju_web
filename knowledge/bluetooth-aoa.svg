<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">03 / AoA: FROM PHASE TO DIRECTION</text><text x="45" y="87" fill="#94a3b8" font-size="19">The receiving array estimates an arrival angle. Installation geometry is needed to calculate position.</text><path d="M45 113H1155" stroke="#334155"/><path d="M80 170H740" stroke="#64748b" stroke-width="4"/><text x="90" y="151" fill="#64748b" font-size="16">CEILING</text>
