<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">01 / FIXED GATEWAYS, MOVING TAGS</title><desc id="desc">BLE broadcasts become observations. The location engine turns observations into zones or positions.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern><marker id="cyan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#22d3ee" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34d399" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" fill="#020617"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">01 / FIXED GATEWAYS, MOVING TAGS</text><text x="45" y="87" fill="#94a3b8" font-size="19">BLE broadcasts become observations. The location engine turns observations into zones or positions.</text><path d="M45 113H1155" stroke="#334155"/><text x="60" y="160" fill="#22d3ee" font-size="17">MOVING</text><text x="415" y="160" fill="#22d3ee" font-size="17">FIXED RECEIVERS</text><text x="835" y="160" fill="#34d399" font-size="17">APPLICATION</text>
  <rect x="60" y="280" width="250" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="82" y="320" fill="#f8fafc" font-size="23">Personnel / asset tag</text><text x="82" y="352" fill="#94a3b8" font-size="18">ID + supported telemetry</text>
  <rect x="415" y="200" width="290" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="437" y="240" fill="#f8fafc" font-size="23">Gateway 01</text><text x="437" y="272" fill="#94a3b8" font-size="18">Known installation point</text><rect x="415" y="415" width="290" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="437" y="455" fill="#f8fafc" font-size="23">Gateway 02</text><text x="437" y="487" fill="#94a3b8" font-size="18">Known installation point</text>
  <path d="M312 310 L411 250" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#cyan)"/><path d="M312 351 L411 460" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#cyan)"/>
  <text x="77" y="420" fill="#94a3b8" font-size="19">Radio broadcasts</text><text x="77" y="449" fill="#94a3b8" font-size="17">No position in the signal itself</text>
  <rect x="835" y="290" width="300" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="857" y="330" fill="#f8fafc" font-size="23">Location engine</text><text x="857" y="362" fill="#94a3b8" font-size="18">Station map + observations</text>
  <path d="M710 251 L828 313" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/><path d="M710 464 L828 367" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/>
  <text x="774" y="203" fill="#34d399" font-size="18">Ethernet / backhaul</text><text x="857" y="455" fill="#cbd5e1" font-size="20">Zone A / last seen / track</text><text x="857" y="486" fill="#94a3b8" font-size="17">Output depends on method</text>
  <text x="60" y="579" fill="#22d3ee" font-size="18">Dashed: radio path</text><text x="420" y="579" fill="#34d399" font-size="18">Solid: forwarded data</text><path d="M45 622H1155" stroke="#334155"/><text x="45" y="655" fill="#64748b" font-size="15">JINJU / POSITIONING TECHNOLOGIES</text><text x="840" y="655" fill="#64748b" font-size="15">CONCEPT ONLY · NOT TO SCALE</text></g></svg>