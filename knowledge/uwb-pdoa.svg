  <rect x="830" y="190" width="320" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="852" y="230" fill="#f8fafc" font-size="23">Angle estimator</text><text x="852" y="262" fill="#94a3b8" font-size="18">Phase + array calibration</text><path d="M719 218 L820 235" fill="none" stroke="#34d399" stroke-width="3"  marker-end="url(#green)"/>
  <rect x="830" y="440" width="320" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="852" y="480" fill="#f8fafc" font-size="23">Position constraints</text><text x="852" y="512" fill="#94a3b8" font-size="18">Range + angle + geometry</text>
