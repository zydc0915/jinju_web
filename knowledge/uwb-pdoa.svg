<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">03 / PDoA: PHASE BECOMES DIRECTION</text><text x="45" y="87" fill="#94a3b8" font-size="19">A calibrated array estimates AoA. Combine direction with range or other spatial constraints.</text><path d="M45 113H1155" stroke="#334155"/><rect x="55" y="450" width="240" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="77" y="490" fill="#f8fafc" font-size="23">UWB tag</text><text x="77" y="522" fill="#94a3b8" font-size="18">Compatible signal</text>
