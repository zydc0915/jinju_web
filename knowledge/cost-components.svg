<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">RTLS BUDGET / MAKE THE FULL SCOPE VISIBLE</title><desc id="desc">Separate delivery work from ongoing operation before comparing proposals.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".25"/></pattern><marker id="cyan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#22d3ee" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#34d399" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" fill="#020617"/><rect width="1200" height="680" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="45" y="53" fill="#f8fafc" font-size="30">RTLS BUDGET / MAKE THE FULL SCOPE VISIBLE</text><text x="45" y="87" fill="#94a3b8" font-size="19">Separate delivery work from ongoing operation before comparing proposals.</text><path d="M45 113H1155" stroke="#334155"/><rect x="60" y="185" width="320" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="82" y="225" fill="#f8fafc" font-size="23">Devices</text><text x="82" y="257" fill="#94a3b8" font-size="18">Tags, anchors and spares</text><rect x="440" y="185" width="320" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="462" y="225" fill="#f8fafc" font-size="23">Infrastructure</text><text x="462" y="257" fill="#94a3b8" font-size="18">Mounts, power and network</text><rect x="820" y="185" width="320" height="100" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".65"/><text x="842" y="225" fill="#f8fafc" font-size="23">Software</text><text x="842" y="257" fill="#94a3b8" font-size="18">Engine, maps and licenses</text>
  <rect x="60" y="375" width="320" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="82" y="415" fill="#f8fafc" font-size="23">Integration</text><text x="82" y="447" fill="#94a3b8" font-size="18">Identity, events and interfaces</text><rect x="440" y="375" width="320" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="462" y="415" fill="#f8fafc" font-size="23">Commissioning</text><text x="462" y="447" fill="#94a3b8" font-size="18">Survey, tests and handover</text><rect x="820" y="375" width="320" height="100" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity=".65"/><text x="842" y="415" fill="#f8fafc" font-size="23">Operation</text><text x="842" y="447" fill="#94a3b8" font-size="18">Support, charging and renewal</text>
  <text x="60" y="565" fill="#cbd5e1" font-size="22">Use a quantity or work package for every line. Equal blocks do not represent equal costs.</text><path d="M45 622H1155" stroke="#334155"/><text x="45" y="655" fill="#64748b" font-size="15">JINJU / POSITIONING TECHNOLOGIES</text><text x="840" y="655" fill="#64748b" font-size="15">CONCEPT ONLY · NOT TO SCALE</text></g></svg>