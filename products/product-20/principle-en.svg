<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520" role="img" aria-labelledby="title desc">
<title id="title">UWB range and angle positioning</title><desc id="desc">A ceiling station measures elevation, azimuth and range to a tag. Its coordinates are resolved on a reference plane.</desc>
<rect width="700" height="520" rx="20" fill="#f1f5f9"/>
<path d="M100 365 425 255 620 375 290 485Z" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
<path d="M100 100V365M100 100 400 370M400 370V440M100 365 400 440" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7"/>
<path d="M100 170Q135 170 153 151M177 338Q220 367 190 388" fill="none" stroke="#f59e0b" stroke-width="3"/>
<rect x="72" y="65" width="56" height="34" rx="12" fill="#0f172a"/><circle cx="100" cy="92" r="10" fill="#22d3ee"/>
<circle cx="400" cy="370" r="10" fill="#0891b2"/><circle cx="400" cy="440" r="6" fill="#10b981"/>
<g font-family="Arial, sans-serif" fill="#0f172a" font-size="18"><text x="65" y="45">UWB AoA station</text><text x="145" y="192">Elevation</text><text x="242" y="229">Range</text><text x="210" y="390">Azimuth</text><text x="420" y="370">Tag</text><text x="413" y="445">Position (x, y)</text><text x="30" y="275" transform="rotate(-90 30 275)">Mounting height</text><text x="420" y="411" font-size="15">Tag height</text><text x="400" y="300" font-size="15" fill="#64748b">Reference plane</text><text x="55" y="507" font-size="13" fill="#64748b">Concept diagram · not to scale</text></g>
</svg>
